# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.2.0/docs/schemas/icp-yaml-schema.json
#
# icp-cli project config for ICGPT (successor to dfx.json — dfx is deprecated).
#
# Canisters:
#   - icgpt_admin            : Motoko controller / early-access gate (mops build).
#   - llama_cpp_qwen*_*      : the three LLM canisters, all installing the SAME prebuilt
#                              llama_cpp_canister v0.16.2 wasm (models differ by the gguf
#                              uploaded + load_model args, not the wasm).
#   - canister_frontend      : the React studio, served by the official IC assets canister
#                              (honors src/frontend/src/.ic-assets.json5 — CSP + SPA fallback).
#
# Environments: `local` (local replica) and `production` (IC mainnet). The three LLM
# canisters are wired declaratively per environment: 3.75 GiB wasm-memory limit and
# controllers = [deployer, icgpt_admin] (the hard gate — only icgpt_admin, the controller
# canister, may reach the LLMs; the deployer principal is kept so we retain management).
#
# NOTE: existing canister IDs (local + the live mainnet IDs) are imported into icp's ID
# store with `icp canister link <name> <principal> -e <env>` — see the Makefile / README.
# The gguf upload runs through `make upload-*`, which uses the icp-native uploader vendored
# with llama_cpp_canister v0.16.2 (reads `icp network status` + `icp identity export`).

canisters:
  - name: icgpt_admin
    recipe:
      type: '@dfinity/motoko@v5.0.0'
      configuration:
        shrink: true

  - name: llama_cpp_qwen25_05b_q8
    recipe:
      type: '@dfinity/prebuilt@v2.0.0'
      configuration:
        path: llms/llama_cpp_canister/build/llama_cpp.wasm
        sha256: e11514fb02ae9d993ec30974882bf798820d6b38e97d0ebae1fadbf06b6c9753

  - name: llama_cpp_qwen3_06b_q8
    recipe:
      type: '@dfinity/prebuilt@v2.0.0'
      configuration:
        path: llms/llama_cpp_canister/build/llama_cpp.wasm
        sha256: e11514fb02ae9d993ec30974882bf798820d6b38e97d0ebae1fadbf06b6c9753

  - name: llama_cpp_qwen3_17b_q4
    recipe:
      type: '@dfinity/prebuilt@v2.0.0'
      configuration:
        path: llms/llama_cpp_canister/build/llama_cpp.wasm
        sha256: e11514fb02ae9d993ec30974882bf798820d6b38e97d0ebae1fadbf06b6c9753

  # Gemma-3-270M — the smallest on-chain model (same llama_cpp v0.16.2 wasm; the
  # b10076 fork is required to load the gemma3 arch). ~0.9 GiB heap after load, so it
  # does NOT get the 3.75 GiB wasm_memory_limit bump (see settings below).
  - name: llama_cpp_gemma3_270m
    recipe:
      type: '@dfinity/prebuilt@v2.0.0'
      configuration:
        path: llms/llama_cpp_canister/build/llama_cpp.wasm
        sha256: e11514fb02ae9d993ec30974882bf798820d6b38e97d0ebae1fadbf06b6c9753

  - name: canister_frontend
    recipe:
      type: '@dfinity/asset-canister@v2.2.1'
      configuration:
        # The webpack build (make icp-deploy-frontend) produces this dir with .ic-assets.json5
        # at its root. Canister IDs are NOT baked in — the frontend reads them at runtime from
        # the ic_env cookie the asset canister serves. No recipe-level build.
        dir: dist/frontend

networks:
  # Project-local managed replica, started with `icp network start`. The gateway port is
  # `0` (Random): the OS assigns a free ephemeral port, so parallel projects / worktrees /
  # agents never collide on a fixed 8000. Consequence — the port changes on every
  # `icp network start`, so nothing may hardcode it; read it back from
  # `icp network status -e local --json` (.gateway_url / .api_url). The IC (`ic`) network
  # is built in.
  - name: local
    mode: managed
    gateway:
      port: 0
    # Deploy a LOCAL Internet Identity too (served at http://id.ai.localhost:<port>/authorize,
    # II canister uqzsh-gqaaa-aaaaq-qaada-cai). Local dev then signs in against this throwaway
    # II (fast, no real passkey / real anchor) instead of mainnet id.ai — the frontend picks the
    # local II URL on localhost and id.ai in production (see LoginWithInternetIdentity.jsx). The
    # dev server injects the actual II URL (with the ephemeral port) via the ic_env cookie.
    ii: true

environments:
  - name: local
    network: local
    settings: &llm_settings
      llama_cpp_qwen25_05b_q8:
        wasm_memory_limit: 3.75gib
        controllers:
          - chfec-vmrjj-vsmhw-uiolc-dpldl-ujifg-k6aph-pwccq-jfwii-nezv4-2ae
          - icgpt_admin
      llama_cpp_qwen3_06b_q8:
        wasm_memory_limit: 3.75gib
        controllers:
          - chfec-vmrjj-vsmhw-uiolc-dpldl-ujifg-k6aph-pwccq-jfwii-nezv4-2ae
          - icgpt_admin
      llama_cpp_qwen3_17b_q4:
        wasm_memory_limit: 3.75gib
        controllers:
          - chfec-vmrjj-vsmhw-uiolc-dpldl-ujifg-k6aph-pwccq-jfwii-nezv4-2ae
          - icgpt_admin
      llama_cpp_gemma3_270m:
        # No wasm_memory_limit bump — 270M uses ~0.9 GiB (the default limit is enough).
        # Only the hard-gate controllers are set (chfec deployer + icgpt_admin).
        controllers:
          - chfec-vmrjj-vsmhw-uiolc-dpldl-ujifg-k6aph-pwccq-jfwii-nezv4-2ae
          - icgpt_admin

  - name: production
    network: ic
    settings: *llm_settings
