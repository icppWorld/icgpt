<!DOCTYPE html>
<html lang="en" class="drac-bg-black">
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />

    <!-- Bootstrap 5: Required meta tags for proper responsive behaviors -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      NOTE: These tags live here, in the static html, and NOT in a react-helmet
            <Head/>. Social & search crawlers do not run our JavaScript, so any
            tag that react-helmet injects at runtime is invisible to them.
            react-helmet is still used for the per route <title>.
    -->
    <title>ICGPT — On-chain Prompt Studio</title>
    <meta
      name="description"
      content="ICGPT On-chain Prompt Studio — design, test & refine prompts against a real LLM running verifiably inside Internet Computer canisters: the same on-chain LLM the funnAI mAIners run. Built for the funnAI task board (coming soon)."
    />
    <meta
      name="keywords"
      content="prompt design, on-chain LLM, funnAI, Proof of AI Work, mAIner, Internet Computer, ICP, onicai, AI, LLM"
    />
    <meta name="author" content="onicai" />
    <link rel="canonical" href="https://icgpt.onicai.com/" />
    <link rel="icon" href="favicon.ico" />

    <!-- Open Graph: LinkedIn, Facebook, OpenChat, Discord, ... -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ICGPT" />
    <meta property="og:url" content="https://icgpt.onicai.com/" />
    <meta property="og:title" content="ICGPT — On-chain Prompt Studio" />
    <meta
      property="og:description"
      content="Design, test & refine prompts against a real LLM running verifiably inside Internet Computer canisters — the same on-chain LLM the funnAI mAIners run. Built for the funnAI task board (coming soon)."
    />
    <meta property="og:image" content="https://icgpt.onicai.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="ICGPT — On-chain Prompt Studio" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@onicaiHQ" />
    <meta name="twitter:title" content="ICGPT — On-chain Prompt Studio" />
    <meta
      name="twitter:description"
      content="Design, test & refine prompts against a real LLM running verifiably inside Internet Computer canisters — the same on-chain LLM the funnAI mAIners run. Built for the funnAI task board (coming soon)."

    <meta
      name="twitter:image"
      content="https://icgpt.onicai.com/og-image.png"
    />
